# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # env:
        #   VITE_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
        #   VITE_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
        #   VITE_SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
        # Add any other environment variables your build needs

      # Optional: If you have Sanity Studio and want to build it too
      # - name: Build Sanity Studio
      #   run: |
      #     cd sanity
      #     npm ci
      #     npm run build
      #     cp -r dist ../dist/sanity-studio

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
